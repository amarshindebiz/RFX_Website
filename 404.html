<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Lost in the Comp | Reimagine FX</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 100px 24px 60px;
      position: relative; overflow: hidden;
    }
    .nf-wrap::before {
      content: '';
      position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
      width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, var(--gold-dim), transparent 65%);
      pointer-events: none;
    }
    .nf-code {
      font-family: var(--font-display);
      font-size: clamp(120px, 24vw, 280px);
      font-weight: 700; line-height: 0.9; letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--gold-border);
      position: relative;
    }
    .nf-title {
      font-family: var(--font-display);
      font-size: clamp(22px, 3vw, 34px); font-weight: 700;
      color: var(--text); margin: 20px 0 12px;
    }
    .nf-sub { font-size: 15px; color: var(--text2); max-width: 460px; margin-bottom: 36px; }
    .nf-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="nf-wrap">
    <div class="nf-code">404</div>
    <h1 class="nf-title">Lost in the comp.</h1>
    <p class="nf-sub">This node doesn't exist — the page may have been moved, renamed, or rendered out of existence.</p>
    <div class="nf-actions">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/products" class="btn btn-outline">Browse Products</a>
    </div>
  </div>
  <script src="/js/shared.js"></script>
  <script>
    document.getElementById('nav-placeholder').outerHTML = buildNav('');
    initNav();
  </script>
</body>
</html>
