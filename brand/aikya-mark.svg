<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 72 368 368" role="img" aria-label="Reimagine FX">
  <style>
    .line { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.6s cubic-bezier(.4,0,.2,1) both; }
    .lower { animation-delay: .16s; }
    .center { transform-origin: 256px 256px; animation: settle .5s ease-out 1.2s both; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes settle { from { opacity: 0; transform: scale(.65); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .line, .center { animation: none; } }
  </style>
  <g fill="none" stroke="#C7A253" stroke-width="12" stroke-linejoin="miter" stroke-linecap="butt">
    <path class="line" pathLength="1" d="M236 236 L96 96 L416 96 L276 236"/>
    <path class="line lower" pathLength="1" d="M276 276 L416 416 L96 416 L236 276"/>
  </g>
  <polygon class="center" fill="#C7A253" points="256,236 276,256 256,276 236,256"/>
</svg>
